name: Microsoft Foundry Hosted Agent Validator
description: Run static Foundry validation and post the report on pull requests.
author: Xiaofu Huang

inputs:
  github-token:
    description: GitHub token with Copilot requests and PR comment access.
    required: true
  validate-path:
    description: Directory to recursively scan for hosted agents.
    required: false
    default: .
runs:
  using: composite
  steps:
    - name: Validate Microsoft Foundry hosted agent
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_VALIDATE_PATH: ${{ inputs.validate-path }}
        ACTION_PATH: ${{ github.action_path }}
        VALIDATION_REF: codex/foundry-validation-reports
      run: bash "${{ github.action_path }}/run.sh"

    - name: Upload Foundry validation reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: foundry-validation-reports
        path: ${{ runner.temp }}/foundry-validation-artifacts/**
        if-no-files-found: warn
        retention-days: 7

branding:
  icon: shield
  color: blue
