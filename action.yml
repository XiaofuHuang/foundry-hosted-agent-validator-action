name: Microsoft Foundry Hosted Agent Validator
description: Run static Foundry validation and post the report on pull requests.
author: Xiaofu Huang

inputs:
  github-token:
    description: GitHub token with Copilot requests and PR comment access.
    required: true
  agent-path:
    description: Hosted-agent root relative to the caller workspace.
    required: false
    default: .
  comment-on-pr:
    description: Post a new report comment when triggered by a pull request.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Validate Microsoft Foundry hosted agent
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_AGENT_PATH: ${{ inputs.agent-path }}
        INPUT_COMMENT_ON_PR: ${{ inputs.comment-on-pr }}
      run: bash "${{ github.action_path }}/run.sh"

branding:
  icon: shield
  color: blue
