name: Test publisher

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Check Action files
        shell: bash
        run: |
          set -euo pipefail
          bash -n run.sh
          grep -F '@github/copilot@1.0.83' run.sh
          grep -F 'VALIDATION_REF:' action.yml
          grep -F -- '--branch "$VALIDATION_REF"' run.sh
          grep -F 'plugins/azure-skills/skills/microsoft-foundry/foundry-agent/validate' run.sh
          grep -F 'outputPath=' run.sh
          grep -F 'workspacePath=' run.sh
          grep -F 'rulesFile=' run.sh
          grep -F 'agent-validation-*-rules.yaml' run.sh
          grep -F 'INPUT_RULES_FILE:' action.yml
          grep -F -- "--proto '=https' --noproxy '*'" run.sh
          grep -F -- '--connect-timeout 10 --max-time 30' run.sh
          grep -F 'must resolve to a public IPv4 address' run.sh
          grep -F 'must return HTTP 200 without redirects' run.sh
          grep -F 'Local rules-file must not be a symbolic link' run.sh
          grep -F 'Local rules-file must resolve inside validate-path' run.sh
          grep -F 'name: validate-foundry-ci' skills/validate-foundry-ci/SKILL.md
          grep -F 'copilot skill add "$skill_parent"' run.sh
          grep -F 'validate-foundry-ci must resolve to the downloaded temporary skill' run.sh
          grep -F -- '--allow-tool=write' run.sh
          ! grep -F 'azd' run.sh
          ! grep -F 'copilot plugin install' run.sh
          grep -F 'pull-requests: write' README.md
          grep -F 'copilot-requests: write' README.md
          test "$(find skills/validate-foundry-ci -type f | wc -l)" -eq 1
