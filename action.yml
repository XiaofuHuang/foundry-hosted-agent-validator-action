name: Microsoft Foundry Hosted Agent Validator
description: Run static Foundry validation and post the report on pull requests.
author: Xiaofu Huang

inputs:
  github-token:
    description: GitHub token with Copilot requests and PR comment access.
    required: true
  agent-path:
    description: Directory containing exactly one hosted agent.
    required: false
    default: .
  rules-file:
    description: Optional local path relative to agent-path or public HTTPS URL.
    required: false
    default: ""
outputs:
  artifact-name:
    description: Name of the uploaded validation artifact.
    value: ${{ steps.prepare.outputs.artifact-name }}
  report-path:
    description: Path to the generated Markdown report.
    value: ${{ steps.collect.outputs.report-path }}
runs:
  using: composite
  steps:
    - name: Set up Node.js
      id: setup
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: "24"

    - name: Install Copilot CLI
      id: install
      shell: bash
      run: npm install --global --no-audit --no-fund @github/copilot@1.0.83

    - name: Prepare validation
      id: prepare
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_AGENT_PATH: ${{ inputs.agent-path }}
        INPUT_RULES_FILE: ${{ inputs.rules-file }}
      run: node "${{ github.action_path }}/scripts/prepare.mjs"

    - name: Download and register Foundry validation skill
      id: skill
      shell: bash
      env:
        COPILOT_AUTO_UPDATE: "false"
        COPILOT_HOME: ${{ steps.prepare.outputs.copilot-home }}
        SKILL_PARENT: ${{ steps.prepare.outputs.skill-parent }}
        SKILL_ROOT: ${{ steps.prepare.outputs.skill-root }}
        SOURCE_REPO: ${{ steps.prepare.outputs.source-repo }}
        VALIDATION_REF: codex/foundry-validation-reports
      run: bash "${{ github.action_path }}/scripts/fetch-skill.sh"

    - name: Validate Microsoft Foundry hosted agent
      id: validate
      continue-on-error: true
      shell: bash
      env:
        AGENT_ROOT: ${{ steps.prepare.outputs.agent-root }}
        COPILOT_AUTO_UPDATE: "false"
        COPILOT_GITHUB_TOKEN: ${{ inputs.github-token }}
        COPILOT_HOME: ${{ steps.prepare.outputs.copilot-home }}
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        OUTPUT_ROOT: ${{ steps.prepare.outputs.output-root }}
        PROMPT_FILE: ${{ steps.prepare.outputs.prompt-file }}
        RULES_ROOT: ${{ steps.prepare.outputs.rules-root }}
        SKILL_ROOT: ${{ steps.prepare.outputs.skill-root }}
      run: |
        set -euo pipefail
        extra_directories=()
        if [[ -n "$RULES_ROOT" ]]; then
          extra_directories+=(--add-dir "$RULES_ROOT")
        fi
        copilot \
          -C "$AGENT_ROOT" \
          --prompt "$(cat "$PROMPT_FILE")" \
          --add-dir "$SKILL_ROOT" \
          --add-dir "$OUTPUT_ROOT" \
          "${extra_directories[@]}" \
          --allow-tool=write \
          --no-ask-user \
          --no-auto-update \
          --silent

    - name: Collect Foundry validation reports
      id: collect
      if: always()
      continue-on-error: true
      shell: bash
      env:
        ARTIFACT_ROOT: ${{ steps.prepare.outputs.artifact-root }}
        OUTPUT_ROOT: ${{ steps.prepare.outputs.output-root }}
        REPORT_ID: ${{ steps.prepare.outputs.report-id }}
      run: node "${{ github.action_path }}/scripts/collect-report.mjs"

    - name: Publish validation report on the pull request
      id: report-comment
      if: ${{ always() && github.event_name == 'pull_request' && steps.collect.outputs.report-path != '' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        REPORT_PATH: ${{ steps.collect.outputs.report-path }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require("node:fs");
          await github.rest.issues.createComment({
            ...context.repo,
            issue_number: context.payload.pull_request.number,
            body: fs.readFileSync(process.env.REPORT_PATH, "utf8"),
          });

    - name: Publish validation failure on the pull request
      id: failure-comment
      if: ${{ always() && github.event_name == 'pull_request' && steps.collect.outputs.report-path == '' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          await github.rest.issues.createComment({
            ...context.repo,
            issue_number: context.payload.pull_request.number,
            body: [
              "## Microsoft Foundry hosted-agent validation",
              "",
              "**Validation failed before any report was produced.**",
              "",
              `[View workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join("\n"),
          });

    - name: Upload Foundry validation reports
      id: upload
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.prepare.outputs.artifact-name || format('foundry-validation-{0}', github.run_id) }}
        path: ${{ steps.prepare.outputs.artifact-root || format('{0}/foundry-validation-artifacts', runner.temp) }}
        if-no-files-found: warn
        retention-days: 7

    - name: Complete validation
      if: always()
      shell: bash
      env:
        COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        EVENT_NAME: ${{ github.event_name }}
        FAILURE_COMMENT_OUTCOME: ${{ steps.failure-comment.outcome }}
        INSTALL_OUTCOME: ${{ steps.install.outcome }}
        PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
        REPORT_COMMENT_OUTCOME: ${{ steps.report-comment.outcome }}
        REPORT_PATH: ${{ steps.collect.outputs.report-path }}
        SETUP_OUTCOME: ${{ steps.setup.outcome }}
        SKILL_OUTCOME: ${{ steps.skill.outcome }}
        UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
      run: |
        set -euo pipefail
        failed=false
        for outcome in \
          "$SETUP_OUTCOME" "$INSTALL_OUTCOME" "$PREPARE_OUTCOME" \
          "$SKILL_OUTCOME" "$VALIDATION_OUTCOME" "$COLLECT_OUTCOME" \
          "$UPLOAD_OUTCOME"; do
          if [[ "$outcome" != "success" ]]; then
            failed=true
          fi
        done
        if [[ "$EVENT_NAME" == "pull_request" ]]; then
          comment_outcome="$FAILURE_COMMENT_OUTCOME"
          if [[ -n "$REPORT_PATH" ]]; then
            comment_outcome="$REPORT_COMMENT_OUTCOME"
          fi
          if [[ "$comment_outcome" != "success" ]]; then
            failed=true
          fi
        fi
        if [[ "$failed" == "true" ]]; then
          echo "::error::Microsoft Foundry hosted-agent validation failed"
          exit 1
        fi

branding:
  icon: shield
  color: blue
