name: Test publisher

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Check Action files
        shell: bash
        run: |
          set -euo pipefail
          bash -n run.sh
          python3 -m unittest discover -s tests -v
          grep -F '@github/copilot@1.0.83' run.sh
          grep -F 'VALIDATION_REF:' action.yml
          grep -F -- '--branch "$VALIDATION_REF"' run.sh
          grep -F 'plugins/azure-skills/skills/microsoft-foundry/foundry-agent/validate' run.sh
          grep -F 'outputPath=' scripts/run_invocations.py
          grep -F 'workspacePath=' scripts/run_invocations.py
          grep -F 'rulesFile=' scripts/run_invocations.py
          grep -F 'agent-validation-*-rules.yaml' run.sh
          grep -F 'INPUT_RULES_FILE:' action.yml
          grep -F -- "--proto '=https' --noproxy '*'" run.sh
          grep -F -- '--connect-timeout 10 --max-time 30' run.sh
          grep -F 'must resolve to a public IPv4 address' run.sh
          grep -F 'must return HTTP 200 without redirects' run.sh
          grep -F 'Local rules-file must not be a symbolic link' run.sh
          grep -F 'Local rules-file must resolve inside validate-path' run.sh
          grep -F 'name: validate-foundry-ci' skills/validate-foundry-ci/SKILL.md
          grep -F 'copilot skill add "$skill_parent"' run.sh
          grep -F 'validate-foundry-ci must resolve to the downloaded temporary skill' run.sh
          grep -F "find \"\$validate_root\" -type f -name 'azure.yaml' -print0" run.sh
          grep -F 'LC_ALL=C sort -z' run.sh
          grep -F "report_id=\"\$(date -u +'%Y%m%dT%H%M%SZ')\"" run.sh
          grep -F 'reportId={report_id}' scripts/run_invocations.py
          grep -F 'do not process nested azure.yaml files' scripts/run_invocations.py
          grep -F 'Root agent-validation-rules.yaml must be a non-empty regular file' run.sh
          grep -F 'cp "$rules_file" "$rules_root/custom-rules.yaml"' run.sh
          grep -F 'find "$rules_root" -type f -exec chmod a-w {} +' run.sh
          grep -F 'scripts/aggregate_reports.py' run.sh
          grep -F 'scripts/run_invocations.py' run.sh
          grep -F 'MAX_VALIDATION_WORKERS=3' run.sh
          grep -F -- '--max-workers "$MAX_VALIDATION_WORKERS"' run.sh
          grep -F 'MAX_WORKERS_LIMIT = 3' scripts/run_invocations.py
          grep -F 'copilot-home' scripts/run_invocations.py
          grep -F 'stdout.log' scripts/run_invocations.py
          grep -F 'stderr.log' scripts/run_invocations.py
          grep -F 'status_path=root / "status"' scripts/run_invocations.py
          grep -F 'wait "$orchestrator_pid"' run.sh
          grep -F 'if [[ "$orchestration_status" -ne 0 ]]' run.sh
          grep -F "trap 'cancel_run 143' TERM" run.sh
          grep -F 'kill -TERM "$orchestrator_pid"' run.sh
          grep -F '_terminate_and_reap' scripts/run_invocations.py
          grep -F 'start_new_session=os.name == "posix"' scripts/run_invocations.py
          grep -F 'invocation_agent_root="${invocation_path#"$workspace"/}"' run.sh
          grep -F -- '--agent-root "$invocation_agent_root"' run.sh
          grep -F 'skillCommit=$resolved_validation_commit' run.sh
          grep -F -- '--available-tools=view,grep,glob,edit,apply_patch,create' scripts/run_invocations.py
          grep -F -- '--allow-tool=write' scripts/run_invocations.py
          grep -F -- '--deny-tool=shell' scripts/run_invocations.py
          grep -F -- '--deny-tool=url' scripts/run_invocations.py
          grep -F -- '--disable-builtin-mcps' scripts/run_invocations.py
          grep -F -- '--no-ask-user' scripts/run_invocations.py
          grep -F -- '--no-auto-update' scripts/run_invocations.py
          grep -F -- '--no-custom-instructions' scripts/run_invocations.py
          grep -F -- '--silent' scripts/run_invocations.py
          grep -F 'GITHUB_COPILOT_PROMPT_MODE_REPO_HOOKS=false' run.sh
          grep -F '"disableAllHooks":true' run.sh
          grep -F '"disableAllHooks":true' scripts/run_invocations.py
          grep -F 'find "$skill_parent" -type f -exec chmod a-w {} +' run.sh
          grep -F 'find "$validate_root" -type f -exec chmod a-w {} +' run.sh
          grep -F 'find "$validate_root" -type d -exec chmod a-w {} +' run.sh
          ! grep -F 'azd' run.sh
          ! grep -F 'copilot plugin install' run.sh
          grep -F 'pull-requests: write' README.md
          grep -F 'copilot-requests: write' README.md
          test "$(find skills/validate-foundry-ci -type f | wc -l)" -eq 1
