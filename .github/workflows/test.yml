name: Test publisher

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Check Action files
        shell: bash
        run: |
          set -euo pipefail
          bash -n run.sh
          grep -F '@github/copilot@1.0.83' run.sh
          grep -F 'pull-requests: write' README.md
          grep -F 'copilot-requests: write' README.md
          test -f skills/validate-foundry-ci/SKILL.md
          test -f skills/validate-foundry-ci/references/default-rules.yaml
