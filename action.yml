name: Microsoft Foundry Hosted Agent Validator
description: Run static Foundry validation and post the report on pull requests.
author: Xiaofu Huang

inputs:
  github-token:
    description: GitHub token with Copilot requests and PR comment access.
    required: true
  agent-path:
    description: Directory containing exactly one hosted agent.
    required: false
    default: .
  rules-file:
    description: Optional local path relative to agent-path or public HTTPS URL.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Validate Microsoft Foundry hosted agent
      id: validate
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_AGENT_PATH: ${{ inputs.agent-path }}
        INPUT_RULES_FILE: ${{ inputs.rules-file }}
        ACTION_PATH: ${{ github.action_path }}
        VALIDATION_REF: codex/foundry-validation-reports
      run: bash "${{ github.action_path }}/run.sh"

    - name: Upload Foundry validation reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ steps.validate.outputs.artifact-name || format('foundry-validation-{0}', github.run_id) }}
        path: ${{ runner.temp }}/foundry-validation-artifacts/**
        if-no-files-found: warn
        retention-days: 7

branding:
  icon: shield
  color: blue
