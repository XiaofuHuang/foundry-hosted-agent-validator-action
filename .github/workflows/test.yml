name: Test publisher

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Run unit tests
        run: node --test test/*.test.*
      - name: Check shell scripts
        run: bash -n scripts/fetch-skill.sh
      - name: Check Action structure
        shell: bash
        run: |
          set -euo pipefail
          test ! -e run.sh
          test ! -e scripts/run-copilot.sh
          test ! -e scripts/publish.cjs
          grep -F '@github/copilot@1.0.83' action.yml
          grep -F 'VALIDATION_REF:' action.yml
          grep -F -- '--branch "$VALIDATION_REF"' scripts/fetch-skill.sh
          grep -F 'plugins/azure-skills/skills/microsoft-foundry/foundry-agent/validate' scripts/fetch-skill.sh
          grep -F 'copilot skill add "$skill_parent"' scripts/fetch-skill.sh
          grep -F 'COPILOT_HOME:' action.yml
          grep -F -- '--allow-tool=write' action.yml
          test "$(grep -c -F 'actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3' action.yml)" -eq 1
          grep -F 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' action.yml
          grep -F 'github.rest.issues.createComment' action.yml
          test "$(find skills/validate-foundry-ci -type f | wc -l)" -eq 1
